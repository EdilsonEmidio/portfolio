<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="3" filter="url(#shadow)" />

  <!-- Geometric Tech Grid Accents -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2 8" opacity="0.4" />

  <!-- Code brackets subtle watermark -->
  <text x="60" y="215" fill="#334155" font-family="monospace" font-size="36" font-weight="bold" opacity="0.4">&lt;/&gt;</text>
  <text x="290" y="215" fill="#334155" font-family="monospace" font-size="36" font-weight="bold" opacity="0.4">{ ; }</text>

  <!-- Developer Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#334155" stroke="url(#neonCyan)" stroke-width="2" />
  
  <!-- Shoulders & Torso -->
  <path d="M 115 310 C 115 240, 150 220, 200 220 C 250 220, 285 240, 285 310 Z" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="2" />
  <path d="M 135 310 C 135 255, 165 240, 200 240 C 235 240, 265 255, 265 310 Z" fill="#334155" opacity="0.8" />

  <!-- Tech badge on chest -->
  <circle cx="200" cy="275" r="10" fill="url(#neonCyan)" />

  <!-- Monogram Initials Tag -->
  <rect x="145" y="325" width="110" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="344" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">EE FILHO</text>
</svg>
